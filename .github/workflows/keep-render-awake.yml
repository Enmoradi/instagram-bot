name: Keep Render bot awake

on:
  schedule:
    # External fallback stays below Render's 15-minute inactivity window.
    # Editing this schedule also re-registers it after long repository inactivity.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send inbound health request
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            "https://media-telegram-bot-epm5.onrender.com/healthz" \
            --output health.json
          python -c "import json; data=json.load(open('health.json')); assert data.get('status') == 'ok' and data.get('service') == 'music-bot', data; print(data)"
