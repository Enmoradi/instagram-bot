services:
  - type: web
    name: media-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      # توکن را در داشبورد Render وارد کنید (Environment → Add Environment Variable)
      - key: BOT_TOKEN
        sync: false
      # آی‌دی عددی ادمین(ها) — صاحب ربات. برای چند ادمین با کاما جدا کنید.
      - key: ADMIN_IDS
        value: "8451818308"
      # RENDER_EXTERNAL_URL به‌طور خودکار تنظیم می‌شود و برای webhook استفاده می‌گردد.
